#                      Minimal Example Extension - SNMP
# ==================================================================================================
# Dynatrace documentation for the data source: https://docs.dynatrace.com/docs/shortlink/snmp-extensions-reference
# For general extension yaml documentation: https://docs.dynatrace.com/docs/shortlink/extension-yaml
#
# This is a minimal example of how to ingest data. It is not meant to be comprehensive, but rather
# provide a useful starting point to creating custom extensions.
#
# NOTE: For best results, work with these examples using the VS Code Dynatrace Extensions Add-On.
# https://marketplace.visualstudio.com/items?itemName=DynatracePlatformExtensions.dynatrace-extensions
# ==================================================================================================

# Custom extensions must start with the `custom:` prefix.
name: custom:snmp-vscode-example
version: "0.0.1"
minDynatraceVersion: 1.318.0
author:
  # This can be the name of an organization or an actual name.
  name: "Your Name Here"

# Define metadata for the metrics that will be ingested.
metrics:
  # Its a good practice to name metric keys with a prefix that relates to the extension's name/function.
  - key: snmp_example.sys.uptime
    # While not required, metadata is useful for viewing metric descriptions in the UI, and allows for intelligent formatting of units in DQL Tables or dashboard charts for example.
    # See https://docs.dynatrace.com/docs/shortlink/wmi-extensions-reference#metric-metadata for more details.
    metadata:
      displayName: Time since the last re-start
      description: The time (in hundredths of a second) since the network management portion of the system was last re-initialized
      # Available units can be browsed with the 'auto-complete' functionality of VS Code using the Dynatrace Extensions Add-On.
      unit: Unspecified

# This node defines the data source that will be used for gathering data.      
snmp:
  - group: generic-device
    interval:
      minutes: 1
    subgroups:
      - subgroup: Device Info
        # `table: false` means that the metrics/dimensions that are being ingested in this subgroup are all scalar values.
        # See https://docs.dynatrace.com/docs/ingest-from/extensions/develop-your-extensions/data-sources/snmp-extensions/snmp-schema-reference
        # for more details.
        table: false
        dimensions:
          - key: sys.description
            # When using `table: false`, also suffix a `.0` to the OID being used, to indicate that there should not be a table index to 'walk'.
            value: oid:1.3.6.1.2.1.1.1.0
        metrics:
          - key: snmp_example.sys.uptime
            value: oid:1.3.6.1.2.1.1.3.0
      - subgroup: NIC status
        featureSet: Interfaces
        # For this subgroup, `table: true` means that this OID is part of a table. All index values are walked automatically and your OIDs result in a datapoint per row.
        table: true
        dimensions:
          - key: if.idx
            value: oid:1.3.6.1.2.1.2.2.1.1
        metrics:
          - key: snmp_example.if.lastchange
            value: oid:1.3.6.1.2.1.2.2.1.9
            type: gauge
